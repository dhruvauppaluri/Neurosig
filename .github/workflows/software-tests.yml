name: software-tests
# Software-only numerical regression. No FPGA hardware, no large neural-recording downloads, no MEArec/NEURON.
on:
  push:
    branches: [main, "phase*"]
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Regression (real-data checks are reported as missing_dataset, never as passes)
        run: python scripts/run_regression.py --no-realdata --out regression-summary.json
      - name: Show summary
        if: always()
        run: python -c "import json;d=json.load(open('regression-summary.json'));print(d['overall'],d['totals'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-summary
          path: regression-summary.json
